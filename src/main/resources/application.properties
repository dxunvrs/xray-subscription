spring.application.name=xray-subscription

server.port=12258

spring.datasource.url=jdbc:sqlite:xray_subscriber.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

xray.grpc.host=${XRAY_HOST:localhost}
xray.grpc.port=${XRAY_PORT:10085}
xray.inbound.tag=${INBOUND_TAG:vless-inbound}

xray.server.ip=${IP}
xray.server.port=${PORT}
xray.reality.publicKey=${PUBLIC_KEY}
xray.reality.shortId=${SHORT_ID}
xray.reality.sni=${SNI}
xray.reality.fp=${FINGERPRINT}